{% extends "admin/_admin_base.html" %}

{% block admin_title %}User Management{% endblock %}

{% block admin_content %}
<div class="admin-page-header">
    <h2>User Management</h2>
    <input type="text" id="user-search-input" class="glass-input" placeholder="Search by name or email..." style="max-width: 320px;">
</div>

<div class="glass-card admin-table-wrapper">
    <table class="admin-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Storage Used</th>
                <th>Joined</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="users-table-body">
            <tr><td colspan="6" class="skeleton" style="height: 40px;"></td></tr>
        </tbody>
    </table>
</div>

<div id="users-pagination" class="pagination-controls"></div>
{% endblock %}

{% block admin_extra_js %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
